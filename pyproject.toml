[project]
name = "embedding-service-multimodal"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.13"
dependencies = [
    "av>=17.0.1",
    "decord>=0.6.0",
    "langchain>=1.2.15",
    "langchain-openai>=1.1.14",
    "modelscope>=1.35.4",
    "opencv-python>=4.13.0.92",
    "qwen-vl-utils>=0.0.14",
    "transformers>=5.5.4",
    # Removed "+cu128" suffix. uv will automatically pick the CUDA 12.8 wheel
    # via the extra-index-url configured below.
    "torch==2.11.0",
    "torchvision==0.26.0",
    "torchaudio==2.11.0",
]

[tool.uv]
# Point uv to PyTorch's CUDA 12.8 wheel repository
extra-index-url = ["https://download.pytorch.org/whl/cu128"]